<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MLEM</title>
        <meta name="description" content="Click the button to MLEM!" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="theme-color" content="#ff6b8a" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com;"
        />
        <link rel="stylesheet" href="styles.css?v=2" />
        <script
            src="https://challenges.cloudflare.com/turnstile/v0/api.js"
            crossorigin="anonymous"
            async
            defer
        ></script>
    </head>
    <body>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <span class="icon-sun">&#9728;</span>
            <span class="icon-moon">&#9790;</span>
        </button>

        <div class="container">
            <div class="counter-display">
                <div class="counter">
                    <span class="label">your mlems</span>
                    <span id="session-count" class="count">0</span>
                </div>
                <div class="counter">
                    <span class="label">mlems/sec</span>
                    <span id="mps-count" class="count">0</span>
                </div>
                <div class="counter">
                    <span class="label">total mlems</span>
                    <span id="total-count" class="count">...</span>
                </div>
            </div>

            <button id="mlem-button" class="mlem-button">MLEM</button>

            <div id="turnstile-container"></div>
        </div>

        <p class="sound-hint">Unmute your device if you don't hear sound!</p>

        <div class="footer-links">
            <button id="share-button" class="share-button">Share your mlems</button>
            <span class="footer-divider">·</span>
            <a href="https://github.com/etruxton/mlem-click" target="_blank" rel="noopener"
                >View source on GitHub</a
            >
        </div>

        <div id="toast-container" aria-live="polite"></div>

        <div id="mlem-container" aria-hidden="true"></div>

        <script src="config.js?v=2"></script>
        <script src="app.js?v=2"></script>
    </body>
</html>
