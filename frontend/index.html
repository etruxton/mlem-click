<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MLEM</title>
        <meta
            name="description"
            content="Click the button. Hear the mlem. Join the mlem counter."
        />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="theme-color" content="#ff6b8a" />
        <link rel="stylesheet" href="styles.css" />
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    </head>
    <body>
        <!-- Theme toggle -->
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <span class="icon-sun">&#9728;</span>
            <span class="icon-moon">&#9790;</span>
        </button>

        <div class="container">
            <div class="counter-display">
                <div class="counter">
                    <span class="label">your mlems</span>
                    <span id="session-count" class="count">0</span>
                </div>
                <div class="counter">
                    <span class="label">total mlems</span>
                    <span id="total-count" class="count">...</span>
                </div>
            </div>

            <button id="mlem-button" class="mlem-button">MLEM</button>

            <!-- Turnstile invisible widget -->
            <div id="turnstile-container"></div>
        </div>

        <p class="sound-hint">Unmute your phone if you don't hear sound!</p>

        <!-- Mlem container for floating images/emojis -->
        <div id="mlem-container" aria-hidden="true"></div>

        <script src="config.js"></script>
        <script src="app.js"></script>
    </body>
</html>
